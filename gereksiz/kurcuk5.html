    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --card-radius: 12px;
            --font-main: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-y: scroll;
        }
        .container {
            width: 100%;
            max-width: 920px;
            margin: 0 auto;
            padding: 11px 0px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        a {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        .grid-layout {
            display: grid;
            gap: 10px;
        }
        .card {
            position: relative;
            border-radius: var(--card-radius);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            /* Default border/bg fallback */
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: #111;
            min-height: 80px;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            filter: brightness(1.1);
        }
        .card-content {
            padding: 15px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .logo-img {
            height: 30px;
            object-fit: contain;
        }
        .bonus-text {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.2;
        }
        .sub-text {
            font-size: 12px;
            font-weight: 600;
            opacity: 0.9;
        }

        /* --- Header Bölümü (Üstteki 4'lü) --- */
        /* Masaüstünde 4 sütun */
        .header-grid {
            grid-template-columns: repeat(4, 1fr);
        }

        /* Özel Header Kart Renkleri (Gradients) */


        .content-wrapper {
            /* Orijinal koddaki pulsing/repeating gradient yapısı */
            background: repeating-linear-gradient(45deg, #2b1d0e, #2b1d0e 10px, #1a1100 10px, #1a1100 20px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #443311;
        }
        .main-grid {
            grid-template-columns: repeat(3, 1fr);
        }
        .main-card {
            background-color: #000;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .code-badge {
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 2px;
        }
        .footer {
            margin-top: auto;
            padding: 30px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #888;
            gap: 8px;
        }
        .footer-logo {
            width: 24px;
            height: 24px;
            fill: #888;
        }

        /* --- Mobil Uyumluluk --- */
        @media (max-width: 768px) {
            /*
            .header-grid {

            }

            .container {
                padding: 10px;
            }
             */

    </style>
</head>
