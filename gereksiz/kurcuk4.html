<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marco | Canlı Yayın</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-secondary: #a1a1aa;
            --accent-color: #ef4444; /* Canlı yayın kırmızı */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        /* Profil Bölümü */
        .profile {
            margin-bottom: 32px;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(45deg, #222, #444);
            margin: 0 auto 16px;
            border: 2px solid var(--card-border);
            object-fit: cover;
        }

        .name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Linkler */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 18px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Canlı Yayın Özel Buton */
        .live-button {
            border-color: rgba(239, 68, 68, 0.3);
        }

        .live-indicator {
            width: 10px;
            height: 10px;
            background-color: var(--accent-color);
            border-radius: 50%;
            margin-right: 12px;
            position: relative;
            box-shadow: 0 0 10px var(--accent-color);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Sosyal Medya İkonları */
        .social-icons {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-icon {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 24px;
            transition: color 0.3s ease;
        }

        .social-icon:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="profile">
            <img src="https://dayko11.com/favicon.svg" alt="Marco" class="avatar">
            <h1 class="name">Marco</h1>
        </header>

        <main class="links-container">
            <a href="https://t2m.io/zbhsmarc121" class="link-card live-button">
                <span class="live-indicator"></span>
                CANLI YAYIN
            </a>

            <a href="#" class="link-card">Instagram</a>
            <a href="#" class="link-card">Telegram Grubu</a>
            <a href="#" class="link-card">YouTube</a>
        </main>

        <footer class="social-icons">
            <a href="#" class="social-icon">𝕏</a>
            <a href="#" class="social-icon">📷</a>
            <a href="#" class="social-icon">📺</a>
        </footer>
    </div>

</body>
</html>
